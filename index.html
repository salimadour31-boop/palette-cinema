<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palette Cinéma</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="title">Palette Cinéma</h1>
    <select id="lang-select">
      <option value="fr">Français</option>
      <option value="en">English</option>
      <option value="tzm">Tamazight</option>
    </select>
  </header>

  <main>
    <section id="upload-section">
      <label for="file-input" id="upload-label">Choisir une image ou une vidéo</label>
      <input type="file" id="file-input" accept="image/*,video/*">
      <video id="video-preview" controls style="display:none; max-width:100%;"></video>
      <canvas id="canvas" style="display:none;"></canvas>
      <button id="capture-btn" style="display:none;" data-i18n="capture">Capturer le cadre</button>
    </section>

    <section id="palette-section" style="display:none;">
      <h2 data-i18n="palette">Palette extraite</h2>
      <div id="swatches"></div>
      <div id="moods">
        <button class="mood-btn" data-mood="teal-orange">Teal & Orange</button>
        <button class="mood-btn" data-mood="noir">Noir</button>
        <button class="mood-btn" data-mood="pastel">Pastel</button>
        <button class="mood-btn" data-mood="complementary">Complémentaire</button>
      </div>
      <div id="export">
        <button id="copy-css" data-i18n="copyCss">Copier CSS</button>
        <button id="download-png" data-i18n="download">Télécharger PNG</button>
      </div>
    </section>

    <p id="info" data-i18n="info">Outil gratuit dans le navigateur. Aucune donnée n'est envoyée.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
