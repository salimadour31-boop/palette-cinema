<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palette Cinéma</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="bar">
  <h1><span class="dot"></span> Palette Cinéma</h1>
  <label class="lang"><span data-i18n="lang">Langue</span>
    <select id="lang">
      <option value="fr">Français</option>
      <option value="en">English</option>
      <option value="kab">Taqbaylit</option>
    </select>
  </label>
</header>

<main>
  <!-- Source panel: image / video upload -->
  <section class="panel">
    <h2 data-i18n="source">Source</h2>
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*,video/*" hidden>
      <span data-i18n="drop">Déposez une image ou une vidéo, ou cliquez ici</span>
    </label>
    <div id="videoBox" hidden>
      <video id="video" controls muted playsinline></video>
      <button id="grab" data-i18n="grab">Capturer cette image</button>
    </div>
    <canvas id="preview" hidden></canvas>
    <div class="row">
      <label><span data-i18n="count">Couleurs</span> <output id="kOut">6</output>
        <input type="range" id="k" min="5" max="8" value="6"></label>
      <button id="extract" data-i18n="extract" disabled>Extraire</button>
    </div>
  </section>

  <!-- Presets panel -->
  <section class="panel">
    <h2 data-i18n="presets">Looks de film</h2>
    <div id="presets" class="presets"></div>
  </section>

  <!-- Result panel -->
  <section class="panel wide">
    <h2 data-i18n="palette">Palette</h2>
    <p class="hint" data-i18n="hint">Cliquez sur une couleur pour copier son code HEX.</p>
    <div id="swatches" class="swatches"></div>
    <div class="row exports">
      <button data-export="png">PNG</button>
      <button data-export="css">CSS</button>
      <button data-export="json">JSON</button>
      <button data-export="txt">TXT</button>
    </div>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<footer>MIT · <a href="https://github.com/salimadour31-boop/palette-cinema">GitHub</a></footer>
<script src="js/palette.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
